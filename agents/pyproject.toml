[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reguguard"
version = "0.1.0"
description = "ReguGuard AML multi-agent swarm package for Agent Engine"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["reguguard*"]
